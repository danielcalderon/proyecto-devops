name: Workflow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pipeline-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant permisos de ejecución al Maven Wrapper
        run: chmod +x mvnw

      - name: Análisis estático del código
        run: ./mvnw checkstyle:check

      - name: Análisis de calidad del código
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw sonar:sonar -Dsonar.token=$SONAR_TOKEN

      - name: Run unit tests
        run: ./mvnw test

      - name: Upload reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
